[SETTINGS]
CompassScale=60 // Between 100 and 50
CompassUseCamera=1 // 0: Uses ped rotation – 1: Uses the camera
CompassStyle=1 // Default: 1 - Create directory (..\tc\%s\..) with yout style number
CompassPosX=0 // Set the horizontal position from the middle left. (e.g. -15 would be 15 steps left from the middle)
CompassPosY=0 // Set the vertical position. Origin is 10 steps from the top. (e.g. -10 would be exactly on the border of your monitor. ATTENTION: The arrow is 4 steps above the coords)