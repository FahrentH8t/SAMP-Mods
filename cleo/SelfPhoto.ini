Для того, чтобы выбрать необходимую вам клавишу, 
вам необходимо из файла {Номера клавиш.txt} выбрать код нужной вам клавиши.

CAMKEY1 - клавиша №1
CAMKEY2 - клавиша №2
ScreenShot - сделать скриншот (сфотографироваться)

Если вы хотите активировать скрипт одной клавишей, то  "CAMKEY1" и "CAMKEY2"  должны быть одинакового значения.

=====================================

[SelfPH]
CAMKEY1 =192
CAMKEY2 =16
ScreenShot =36


